<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AVERA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AVERA — beauty & care essentials, chosen with care.">
  <meta name="theme-color" content="#3A2721">
  <link rel="icon" type="image/x-icon" href="./assets/images/logoo.png">

  <!-- ==================================
  connections: open them early so fonts & API images start faster
  ================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ecommerceapi.ape-org.com" crossorigin>
  <link rel="dns-prefetch" href="https://pinkyauradevapi.ape-org.com">

  <!-- ==================================
  icons (display=block hides the ligature text until the icon font is ready)
  ================================ -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block" rel="stylesheet">

  <!-- ==================================
  fonts: Playfair Display (headings), Montserrat (body), Tajawal (Arabic)
  ================================ -->
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Tajawal:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
</head>
<body style="margin: 0;">
  <app-root></app-root>
</body>
</html>
