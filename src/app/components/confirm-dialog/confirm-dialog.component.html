
<div class="confirm-dialog">

  <!-- Dialog Icon -->
  <div class="dialog-icon">
    <mat-icon>help_outline</mat-icon>
  </div>


  <!-- Message -->
  <div
    mat-dialog-content
    class="dialog-message"
  >
    {{ data.message }}
  </div>


  <!-- Actions -->
  <div
    mat-dialog-actions
    class="dialog-actions"
  >

    <button
      mat-button
      (click)="onCancel()"
      class="cancel-btn"
    >
      Cancel
    </button>


    <button
      mat-raised-button
      (click)="onConfirm()"
      class="confirm-btn"
    >
      <mat-icon>check</mat-icon>
      Confirm
    </button>

  </div>

</div>
