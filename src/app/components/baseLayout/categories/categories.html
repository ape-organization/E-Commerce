<div class="section-heading">

  <span class="section-small-title">
    {{ 'CATEGORY.CATEGORY' | translate }}
  </span>

  <h2>
    {{ 'CATEGORY.Shop_By_Category' | translate }}
  </h2>

  <div class="title-line">
    <span>✦</span>
  </div>

</div>


<!-- CATEGORY CAROUSEL -->

<div class="category-carousel">

  <!-- LEFT -->

  <button
    type="button"
    class="carousel-arrow category-arrow category-prev"
    (click)="scrollCategories('left')"
    [attr.aria-label]="
      languageService.isArabic()
        ? 'الفئات السابقة'
        : 'Previous categories'
    "
  >
    <mat-icon>
      chevron_left
    </mat-icon>
  </button>


  <!-- CATEGORY LIST -->

  <div
    class="horizontal-track category-track"
    #categoryTrack
  >

    <div
      class="category-card"
      *ngFor="let category of categories()"
      (click)="selectCategory(category)"
    >

      <div class="category-image">

        <img
          [src]="getCategoryImage(category)"
          [alt]="getCategoryName(category)"
          loading="lazy"
        />

      </div>

      <h3>
        {{ getCategoryName(category) }}
      </h3>

    </div>

  </div>


  <!-- RIGHT -->

  <button
    type="button"
    class="carousel-arrow category-arrow category-next"
    (click)="scrollCategories('right')"
    [attr.aria-label]="
      languageService.isArabic()
        ? 'الفئات التالية'
        : 'Next categories'
    "
  >
    <mat-icon>
      chevron_right
    </mat-icon>
  </button>

</div>
