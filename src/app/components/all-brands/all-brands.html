<section class="brands-section">

  <!-- =====================================================
       HEADING
       ===================================================== -->

  <div class="section-heading">

    <span class="section-small-title">
      BEAUTY BRANDS
    </span>

    <h2>
      Shop By Brand
    </h2>

    <div class="title-line">
      <span>✦</span>
    </div>

    <p>
      Discover your favorite beauty brands
    </p>

  </div>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    class="brands-loading"
    *ngIf="isLoadingBrands"
  >

    <span>✦</span>

    Loading brands...

  </div>


  <!-- =====================================================
       BRANDS GRID
       ===================================================== -->

  <div
    class="brands-grid"
    *ngIf="
      !isLoadingBrands &&
      brands().length > 0
    "
  >

    <div
      class="brand-card"
      *ngFor="let brand of brands()"
      (click)="selectBrand(brand)"
    >

      <div class="brand-image">

        <img
          [src]="getBrandImage(brand)"
          [alt]="brand.name"
          loading="lazy"
        />

      </div>

      <h3>
        {{ brand.name }}
      </h3>

    </div>

  </div>


  <!-- =====================================================
       NO BRANDS
       ===================================================== -->

  <div
    class="no-brands"
    *ngIf="
      !isLoadingBrands &&
      brands().length === 0
    "
  >

    <span>✦</span>

    <p>
      No brands available.
    </p>

  </div>

</section>
