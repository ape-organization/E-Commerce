server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses (JS/CSS/JSON/SVG)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # Hashed build output (main-XXXX.js, styles-XXXX.css, chunk-XXXX.js) never changes: cache for a year
    location ~* "-[0-9A-Z]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Translations change with deployments: always revalidate
    location /assets/i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Images & fonts: cache, but revalidate after a week
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html must always be fresh so new deployments are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
